  /api/v1/admin/stop-links:
    get:
      operationId: getStopLinkBoard
      summary: Haltestellen-Editor — endende und beginnende Fahrten an einem Halt
      description: >
        Die Datengrundlage für die Umlauf-Pflege (KURSE §1): Welche Fahrten enden an diesem
        Halt, welche beginnen dort, und was ist bereits entschieden.


        **Warum ein Versionsstand nötig ist.** Der Editor arbeitet auf Periode + Fahrplantyp,
        nicht auf einem Datum (KURSE §2, K5). Innerhalb einer Periode kann eine Linie aber
        mehrere Versionen mit verschiedenen Gültigkeits-Intervallen haben — an einem
        Umsteigepunkt stehen Linie 1 und Linie 13 dann womöglich auf verschiedenen Ständen, und
        die Auswahl wäre mehrdeutig. `stands[]` löst das auf: Zeitabschnitte, in denen sich an
        den hier beteiligten Versionen nichts ändert. Ohne `stand=` wird der Abschnitt
        vorausgewählt, der den heutigen Tag enthält, sonst der letzte.


        **`decision: null` heißt "noch nicht gepflegt"** — ausdrücklich etwas anderes als
        `kind: start`/`end`, die eine bewusst offen gelassene Kette bezeichnen (Aus- bzw.
        Einrücken). Nur so ist der Pflegestand ablesbar; `open_count` zählt genau diese Fälle.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: stop_group
          in: query
          required: true
          description: >
            `stop_groups.id` — die **Haltestelle** als Betriebspunkt, nicht ein einzelner Halt.
            An einer Endstelle liegen Ankunft und Abfahrt oft auf verschiedenen Bahnsteigen.
          schema: { type: integer }
        - name: period
          in: query
          required: true
          description: '`schedule_periods.id`'
          schema: { type: integer }
        - name: day_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FahrplanTyp' }
        - name: stand
          in: query
          required: false
          description: Index eines Versionsstands aus `stands[]`. Ohne Angabe wird vorausgewählt.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Endende und beginnende Fahrten samt Entscheidungen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopLinkBoardResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Haltestelle, unbekannte Periode, unbekannter Fahrplantyp oder Stand außerhalb des Bereichs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/stop-links/auto:
    get:
      operationId: previewAutoTripLinks
      summary: Vorschau — Anschlüsse über einen Zeitraum automatisch verknüpfen oder auflösen
      description: >
        **Garantiert folgenlos.** Schreibt das Muster fort, das an einer Endstelle mit Takt
        offensichtlich ist: Die Bahn kommt an und übernimmt die nächste Abfahrt. Über einen Morgen
        hinweg wiederholt sich das dutzendfach identisch; jeden Übergang einzeln zu klicken ist
        Fleißarbeit ohne eigene Aussage.


        **Die Paarung ist FIFO.** Jede Ankunft im markierten Bereich bekommt die früheste noch
        freie Abfahrt, deren Wendezeit zwischen `min_turnaround_minutes` und
        `max_turnaround_minutes` liegt. Die Höchstwende ist der Abbruch: Reicht keine Abfahrt
        heran, bleibt die Fahrt offen, statt über eine Taktlücke hinweg das falsche Fahrzeug zu
        greifen. Wird ein Kandidat als unzulässig abgewiesen, rückt der nächste nach; erst wenn
        keiner trägt, erscheint die Fahrt unter `skipped`.


        **Der Filter entscheidet mit, und das ist der Punkt.** Ein Linienwechsel 1 -> 13 ist
        manchmal Absicht und manchmal nicht. Verknüpft wird ausschließlich, was der Filter zeigt —
        `lines` ist deshalb eine Mehrfachauswahl: 1 und 13 gemeinsam, die 6 daneben unberührt.


        **Nie überschreiben.** Fahrten, die bereits eine Entscheidung tragen, werden übersprungen
        und gemeldet; ein zweiter Lauf ist folgenlos. Nach jedem Anschluss läuft dieselbe
        Kurs-Angleichung wie beim Einzelklick (KURSE §2 K2).


        **`action=unlink` ist der Rückweg** über dieselbe Markierung: Es löst die Anschlüsse im
        Bereich wieder auf. Kursnummern bleiben dabei stehen — die zerschnittene Kette zerfällt in
        zwei Teile, die **beide** weiter dieselbe Nummer tragen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: stop_group
          in: query
          required: true
          description: '`stop_groups.id` — die Haltestelle als Betriebspunkt.'
          schema: { type: integer }
        - name: period
          in: query
          required: true
          schema: { type: integer }
        - name: day_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FahrplanTyp' }
        - name: stand
          in: query
          required: false
          description: Index eines Versionsstands. Ohne Angabe wird vorausgewählt — wie am Board.
          schema: { type: integer, minimum: 0 }
        - name: from_trip_id
          in: query
          required: true
          description: >
            Die markierte **Startfahrt** der linken Spalte (endende Fahrten). Muss im aktiven
            Filter liegen, sonst 422.
          schema: { type: integer }
        - name: to_trip_id
          in: query
          required: true
          description: Die markierte **letzte Fahrt**. Verkehrt herum markiert wird getauscht.
          schema: { type: integer }
        - name: action
          in: query
          required: false
          description: Vorgabe `link`.
          schema: { type: string, enum: [link, unlink] }
        - name: 'lines[]'
          in: query
          required: false
          description: Linien, die mitlaufen. Ohne Angabe alle Linien der Haltestelle.
          schema:
            type: array
            items: { type: string, maxLength: 8 }
        - name: mode
          in: query
          required: false
          description: Verkehrsmittel-Filter. Nicht zu verwechseln mit `action`.
          schema: { type: string, enum: [tram, bus] }
        - name: min_turnaround_minutes
          in: query
          required: false
          description: Vorgabe aus `COURSE_MIN_TURNAROUND_MINUTES`. Nur bei `action=link`.
          schema: { type: integer, minimum: 0, maximum: 600 }
        - name: max_turnaround_minutes
          in: query
          required: false
          description: >
            Vorgabe aus `COURSE_MAX_TURNAROUND_MINUTES`. Darf nicht unter der Mindestwende liegen.
            Nur bei `action=link`.
          schema: { type: integer, minimum: 1, maximum: 600 }
        - name: include_terminals
          in: query
          required: false
          description: >
            Nur bei `action=unlink`: auch Aus- und Einrücken lösen. Vorgabe `false` — eine
            Betriebsfahrt ist eine eigenständige Aussage und soll nicht nebenbei verschwinden.
          schema: { type: boolean }
      responses:
        '200':
          description: Was der Lauf bewirken würde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoTripLinkResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            Unbekannte Haltestelle/Periode/Fahrplantyp, Stand außerhalb des Bereichs, eine
            Markierung liegt nicht in der gefilterten Liste, oder Höchstwende unter Mindestwende
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: applyAutoTripLinks
      summary: Anschlüsse anlegen oder auflösen
      description: >
        Führt aus, was die Vorschau angekündigt hat, und antwortet in derselben Form — die Zahlen
        sind dann die tatsächlich geschriebenen. Der Plan wird neu gerechnet, weil zwischen
        Vorschau und Anwenden etwas anderes geschrieben worden sein kann.


        Trägt eine Fahrt inzwischen doch eine Entscheidung, wird sie **übersprungen**, nicht mit
        409 abgewiesen: Ein einzelner Zwischenfall darf einen Lauf über 40 Übergänge nicht
        abbrechen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stop_group, period, day_type, from_trip_id, to_trip_id]
              properties:
                stop_group: { type: integer }
                period: { type: integer }
                day_type: { $ref: '#/components/schemas/FahrplanTyp' }
                stand: { type: integer, nullable: true, minimum: 0 }
                from_trip_id: { type: integer }
                to_trip_id: { type: integer }
                action: { type: string, enum: [link, unlink], default: link }
                lines:
                  type: array
                  items: { type: string, maxLength: 8 }
                mode: { type: string, enum: [tram, bus], nullable: true }
                min_turnaround_minutes: { type: integer, minimum: 0, maximum: 600 }
                max_turnaround_minutes: { type: integer, minimum: 1, maximum: 600 }
                include_terminals: { type: boolean, default: false }
      responses:
        '200':
          description: Geschrieben — `skipped` kann trotzdem belegt sein
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutoTripLinkResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            Unbekannte Haltestelle/Periode/Fahrplantyp, Stand außerhalb des Bereichs, eine
            Markierung liegt nicht in der gefilterten Liste, oder Höchstwende unter Mindestwende
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/trip-links:
    post:
      operationId: createTripLink
      summary: Anschluss anlegen oder eine Kette bewusst offen lassen
      description: >
        Eine Zeile ist **eine Entscheidung**: `link` verbindet zwei Fahrten, `start` erklärt eine
        Fahrt zum Beginn eines Umlaufs (Ausrücken), `end` zu dessen Ende (Einrücken). Die beiden
        letzten sind der Betriebsfahrt-Fall — er kommt besonders morgens vor und ist eine
        bewusste Aussage, keine fehlende Pflege.


        **Ketten laufen über Linien hinweg.** Eine 1 wird in Sudenburg zur 13; der Linienwechsel
        wird als Hinweis gemeldet, nicht abgewiesen (KURSE §2, K1).


        **Der Gattungswechsel dagegen wird abgewiesen.** Ein Fahrzeug wird nie vom Tram zum Bus.
        Beides auseinanderzuhalten ist wesentlich, weil dieselbe Linie beides sein kann — N2
        liegt zeitweise als Tram und als Bus vor (Schienenersatzverkehr).


        **Geprüft wird die Haltestelle, nicht der Halt.** An einer Endstelle liegen Ankunft und
        Abfahrt oft auf verschiedenen Bahnsteigen — netzweit bei 64 von 104 Endstellen. Beide
        Halte müssen derselben `stop_group` angehören; gehören sie es nicht, ist das der
        Betriebsfahrt-Fall und gehört als `start`/`end` festgehalten (KURSE §2, K6).


        **Zeiten sind GTFS-Wallclock.** Die Wendezeit wird in Betriebstag-Sekunden gerechnet,
        nie lexikalisch — eine Ankunft `24:50:00` mit Anschlussabfahrt `25:10:00` ergibt 1200 s
        und ist gültig. Eine zu kurze Wendezeit erscheint als Warnung im Ergebnis, eine negative
        wird mit 422 abgewiesen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripLinkRequest' }
      responses:
        '201':
          description: Entscheidung gespeichert — `warnings` kann trotzdem belegt sein
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripLinkResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Eine der beiden Fahrten trägt bereits eine Entscheidung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            Haltestelle passt nicht, verschiedene Periode oder Fahrplantyp, **Gattungswechsel**
            (Tram auf Bus), Gueltigkeiten ueberschneiden sich nicht, Zyklus, oder negative
            Wendezeit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/trip-links/{tripLink}:
    parameters:
      - name: tripLink
        in: path
        required: true
        description: '`trip_links.id`'
        schema: { type: integer }
    delete:
      operationId: deleteTripLink
      summary: Entscheidung wieder lösen
      description: >
        Setzt die beteiligten Fahrten zurück auf "noch nicht gepflegt". Bricht eine Kette in der
        Mitte auf, zerfällt sie in zwei — ein davon abhängiger Kurs bleibt an beiden Teilen
        hängen und ist danach gegebenenfalls neu zu setzen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '204':
          description: Gelöst
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unbekannte Verknüpfung
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/line-versions/{lineVersion}/timetable:
    parameters:
      - name: lineVersion
        in: path
        required: true
        description: '`line_versions.id` — die Fahrplan-Version, deren Inhalt gezeigt wird.'
        schema: { type: integer }
    get:
      operationId: getTimetable
      summary: Fahrplan einer Linien-Version als Matrix
      description: >
        Der vollständige Fahrplan einer Linien-Version im Fahrplanbuch-Format: Halte als Zeilen,
        Fahrten als Spalten. Gruppiert nach Richtung (erster und letzter Halt), innerhalb einer
        Richtung nach Abfahrtszeit sortiert.


        **Warum an der Version und nicht an (Linie, Fahrplantyp):** Für ein Paar können mehrere
        Versionen nebeneinander bestehen — eine für den Zeitraum bis zum Fahrplanwechsel, eine
        danach. Ein Endpunkt, der implizit „die neueste" wählte, verschluckte diese Unterscheidung.
        Die IDs liefert `GET /api/v1/admin/line-versions`.


        **Kein Periodenfilter:** Auch die Fahrpläne eingefrorener Perioden bleiben abrufbar — genau
        dafür gibt es das Konsolidat. `period.status` sagt, ob es sich um Historie handelt.


        Innerhalb einer Richtung können mehrere Haltefolgen vorkommen (Kurzläufer, Umleitungen).
        Sie werden auf **eine** Zeilenachse ausgerichtet; eine Fahrt, die eine Zeile nicht bedient,
        trägt dort `null`. Siehe `variant_count` und `alignment_warning`.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Fahrplan der Version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimetableResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unbekannte Linien-Version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/schedule-periods:
    get:
      operationId: listSchedulePeriods
      summary: Fahrplanperioden auflisten
      description: >
        Die netzweiten, kuratierten Fahrplanperioden (FAHRPLANPERIODEN §4.1) in chronologischer
        Reihenfolge — jüngste zuerst.


        Perioden bilden eine lückenlose, überschneidungsfreie Kette: `valid_to` ist stets abgeleitet
        (Vortag des Nachfolgers), die jüngste Periode bleibt offen. `status: current` trägt die Periode,
        die den heutigen Tag abdeckt.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Liste der Perioden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePeriodListResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      operationId: createSchedulePeriod
      summary: Fahrplanperiode anlegen
      description: >
        Legt eine Periode an und rechnet die Kette neu: Der Vorgänger endet am Vortag, die neue Periode
        ist ab `valid_from` gültig.


        Eine neue Periode **setzt die Linien-Versionen zurück** — jede (Linie, Fahrplantyp) beginnt darin
        wieder mit Version 1 (§4.1). Bereits erfasste Versionen der Vorperiode bleiben als Historie erhalten.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePeriodRequest' }
      responses:
        '201':
          description: Periode angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePeriodResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validierungsfehler — etwa ein bereits belegtes `valid_from`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/schedule-periods/{period}:
    parameters:
      - name: period
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateSchedulePeriod
      summary: Fahrplanperiode ändern
      description: >
        Ändert Label und/oder Beginn. Beim Verschieben von `valid_from` wird die Kette neu gerechnet;
        die Gültigkeit der Nachbarperioden zieht mit.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePeriodRequest' }
      responses:
        '200':
          description: Periode geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePeriodResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validierungsfehler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteSchedulePeriod
      summary: Fahrplanperiode löschen
      description: >
        Nur zulässig, solange **keine** Linien-Versionen an der Periode hängen — sonst ginge
        beobachtete Fahrplan-Historie verloren (409). Nach dem Löschen übernimmt der Vorgänger
        den freigewordenen Zeitraum.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '204':
          description: Periode gelöscht
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Periode trägt Linien-Versionen und bleibt erhalten
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/period-change-offers:
    get:
      operationId: listPeriodChangeOffers
      summary: Offene Periodenwechsel-Vorschläge
      description: >
        Ändern sich an einem Tag mindestens `PERIOD_OFFER_MIN_SHARE` (Vorgabe 33 %) der dort
        verkehrenden Linien gleichzeitig, ist das ein Indiz für einen echten Fahrplanwechsel statt
        für einzelne Baustellen. Das System **bietet** dann einen Periodenwechsel an — es legt ihn
        nicht selbst an (FAHRPLANPERIODEN §4.3).


        Gezählt werden nur **beobachtete** Wechsel: Eine Version, die an der Feed-Fensterkante
        beginnt, ist bloß eine Untergrenze und ergibt keinen Wechseltag.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Offene Vorschläge, ältester Wechseltag zuerst
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodChangeOfferListResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/period-change-offers/{offer}/accept:
    parameters:
      - name: offer
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: acceptPeriodChangeOffer
      summary: Periodenwechsel annehmen
      description: >
        Legt die Periode zum vorgeschlagenen Tag an, **nimmt die Linien-Versionen ab diesem Tag
        zurück** und konsolidiert neu — jede (Linie, Fahrplantyp) startet in der neuen Periode
        wieder bei Version 1. So bleibt die alte Periode frei von Versions-Wildwuchs, der in
        Wahrheit ein einziger Fahrplanwechsel war (§4.3).


        Intervalle, die über den Wechseltag hinweglaufen, werden am Vortag gekappt; ihre neue
        Obergrenze ist ein exakt bekanntes Datum und damit gesichert.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodChangeAcceptRequest' }
      responses:
        '201':
          description: Periode angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePeriodResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Vorschlag wurde bereits beschieden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validierungsfehler
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/period-change-offers/{offer}/decline:
    parameters:
      - name: offer
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: declinePeriodChangeOffer
      summary: Periodenwechsel ablehnen
      description: >
        Die Änderungen bleiben als gewöhnliche Linien-Versionen in der laufenden Periode stehen —
        abgelehnt heißt „war kein Fahrplanwechsel", nicht „war nichts". Derselbe Tag wird bei
        Folge-Importen nicht erneut vorgeschlagen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Vorschlag abgelehnt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodChangeOfferResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Vorschlag wurde bereits beschieden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/imports:
    get:
      operationId: adminListImports
      summary: Import-Historie & Datenstand fürs Admin-Frontend
      description: Gleiche Daten wie GET /api/v1/collector/imports, aber Sanctum-geschützt (Browser, ohne Collector-Token).
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Historie & aktueller Datenstand
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GtfsImportStatusResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/school-holidays:
    get:
      operationId: listSchoolHolidays
      summary: Schulferien-Zeiträume auflisten
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Liste der Ferienzeiten
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SchoolHoliday' } }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      operationId: createSchoolHoliday
      summary: Ferienzeit anlegen
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolHolidayRequest' }
      responses:
        '201': { description: Angelegt, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SchoolHoliday' } } } } } }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validierungsfehler, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/admin/school-holidays/{schoolHoliday}:
    put:
      operationId: updateSchoolHoliday
      summary: Ferienzeit ändern
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - { name: schoolHoliday, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolHolidayRequest' }
      responses:
        '200': { description: Geändert, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SchoolHoliday' } } } } } }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Validierungsfehler, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: deleteSchoolHoliday
      summary: Ferienzeit löschen
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - { name: schoolHoliday, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Gelöscht }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/admin/holidays:
    get:
      operationId: listHolidays
      summary: Berechnete Feiertage (Sachsen-Anhalt) eines Jahres — read-only
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer } }
      responses:
        '200':
          description: Feiertage des Jahres
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidaysResponse' }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/admin/line-colors/{line}:
    put:
      operationId: setLineColor
      summary: Linienfarbe setzen/ändern
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: line
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color: { type: string, description: "Hex inkl. '#', z. B. #c9346c" }
      responses:
        '200':
          description: Farbe gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      route_short_name: { type: string }
                      color: { type: string }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Ungültige Farbe, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      operationId: resetLineColor
      summary: Linienfarbe zurücksetzen
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: line
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Farbe entfernt }
        '401': { description: Nicht authentifiziert, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/collector/imports:
    post:
      operationId: startGtfsImport
      summary: GTFS-Import starten (Basistabellen)
      description: >
        Startet einen Import-Lauf und speichert die Basistabellen idempotent per Upsert.
        Die stop_times folgen separat in Chunks. Body darf gzip-komprimiert sein.
      tags: [Collector]
      security:
        - CollectorToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportStartRequest'
      responses:
        '201':
          description: Lauf gestartet (Status running)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GtfsImportRunResponse' }
        '400':
          description: Ungültiger gzip-Body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Fehlender oder ungültiger Bearer-Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-Limit überschritten (120 Requests/Minute je IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validierungsfehler im Payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: listGtfsImports
      summary: Import-Historie und aktueller Datenstand
      description: >
        Liefert die letzten GTFS-Import-Läufe (Status, Zeitpunkte, Counts, Feed-Version)
        sowie den aktuellen Datenbestand. Dient der Nachvollziehbarkeit des Imports.
      tags: [Collector]
      security:
        - CollectorToken: []
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
          description: Läufe pro Seite
      responses:
        '200':
          description: Import-Historie und Datenstand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GtfsImportStatusResponse'
        '401':
          description: Fehlender oder ungültiger Bearer-Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-Limit überschritten (120 Requests/Minute je IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/collector/imports/{run}/stop-times:
    post:
      operationId: appendStopTimes
      summary: stop_times-Chunk an einen laufenden Import anhängen
      description: Hängt einen Chunk an stop_times an. Body darf gzip-komprimiert sein.
      tags: [Collector]
      security:
        - CollectorToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
          description: ID des laufenden Imports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopTimesChunkRequest'
      responses:
        '200':
          description: Chunk gespeichert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GtfsImportRunResponse' }
        '401':
          description: Fehlender oder ungültiger Bearer-Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-Limit überschritten (120 Requests/Minute je IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Lauf ist bereits abgeschlossen oder fehlgeschlagen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/collector/imports/{run}/finish:
    post:
      operationId: finishGtfsImport
      summary: Import-Lauf abschließen
      description: Markiert den Lauf als erfolgreich abgeschlossen.
      tags: [Collector]
      security:
        - CollectorToken: []
      parameters:
        - name: run
          in: path
          required: true
          schema: { type: integer }
          description: ID des laufenden Imports
      responses:
        '200':
          description: Lauf abgeschlossen (Status success)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GtfsImportRunResponse' }
        '401':
          description: Fehlender oder ungültiger Bearer-Token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate-Limit überschritten (120 Requests/Minute je IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Lauf ist bereits abgeschlossen oder fehlgeschlagen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
