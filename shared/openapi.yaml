    post:
      operationId: mergeStopGroup
      summary: Zwei Haltestellen zusammenlegen
      description: >
        Der Weg fuer „Rothensee (Schleife)" → „Rothensee": Alle Halte der Quelle wandern in die
        Ziel-Haltestelle, die Quelle wird geloescht. Die Mitgliedschaften gelten danach als von
