  /api/v1/admin/logout:
    post:
      operationId: adminLogout
      summary: Aktuellen Admin-Token widerrufen
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '204':
          description: Token widerrufen
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/me:
    get:
      operationId: adminMe
      summary: Angemeldeten Admin abfragen
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Admin-Daten
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/line-versions:
    get:
      operationId: listLineVersions
      summary: Fahrplan-Versionen je Linie und Betriebstag-Typ
      description: >
        Die Änderungshistorie des Fahrplans aus dem Konsolidat (FAHRPLANPERIODEN §5.4):
        je Linie und Fahrplantyp die beobachteten Versionen mit ihren Gültigkeits-Intervallen.


        Eine Version ist über ihren Fingerprint identifiziert — kehrt eine Linie nach einer
        Baustelle zum alten Fahrplan zurück, erscheint dieselbe Version mit einem weiteren
        Intervall statt einer neuen. Grenzen sind nur dann `confirmed`, wenn der Wechsel
        innerhalb eines Feed-Fensters beobachtet wurde; an der Fensterkante sind sie
        Untergrenzen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: line
          in: query
          required: false
          description: Auf eine Linienbezeichnung einschränken.
          schema: { type: string }
        - name: day_type
          in: query
          required: false
          description: Auf einen Fahrplantyp einschränken.
          schema: { $ref: '#/components/schemas/FahrplanTyp' }
        - name: period
          in: query
          required: false
          description: >
            `schedule_periods.id`. Ohne Angabe die **laufende** Periode; beginnt die Kette
            erst in der Zukunft, die jüngste. Auch eine eingefrorene Periode ist erlaubt —
            sonst wäre die gesamte Historie vor einem Periodenwechsel unerreichbar.
          schema: { type: integer }
      responses:
        '200':
          description: Versionen der gewählten Periode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineVersionsResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Periode oder unbekannter day_type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/coverage:
    get:
      operationId: getCoverage
      summary: Abdeckung des Konsolidats
      description: >
        Für welche Zeiträume gibt das Konsolidat den Fahrplan wirklich her — und wo klaffen
        Lücken (FAHRPLANPERIODEN Phase C)?


        **Abgedeckt heißt: mit Inhalt.** Eine Linien-Version belegt nur, *dass* an diesen Tagen
        ein bestimmter Fahrplan galt; abrufbar ist er erst mit konsolidierten Fahrten. Versionen
        ohne Inhalt zählen deshalb nicht als Abdeckung, sondern werden als
        `versions_without_content` ausgewiesen.


        Abschnitte und Lücken sind **fahrplantyp-bezogen**: Zwischen zwei Samstagen liegen sechs
        Tage ohne Samstag — für den `sa`-Strang ist das lückenlose Abdeckung, keine Unterbrechung.
        Eine Lücke wird nur gemeldet, wenn dort tatsächlich Tage dieses Typs fehlen, etwa nach
        einem ausgefallenen Import.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Abdeckung je Linie und Fahrplantyp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/line-version-diff:
    get:
      operationId: getLineVersionDiff
      summary: Zwei Linien-Versionen vergleichen
      description: >
        Was unterscheidet zwei Fahrplan-Versionen derselben Linie und desselben Fahrplantyps?
        Die Versionen-Ansicht zeigt, **dass** ein Wechsel stattfand; dieser Endpunkt zeigt, **welche
        Fahrten** betroffen sind.


        **Verfahren.** Eine Version ist definiert als die sortierte Menge ihrer Fahrt-Signaturen —
        der Vergleich beginnt deshalb als Multiset-Abgleich dieser Signaturen. Fahrten mit gleicher
        Signatur gelten als unverändert.


        Die Signatur enthält allerdings **keine Halte** und nur Minuten
        (`SHA(Linie | Fahrplantyp | HH:MM-Abfahrtssequenz)`). Ein reiner Laufweg-Wechsel bei
        gleichen Zeiten erschiene damit als „unverändert" — deshalb werden gepaarte Signaturen
        zusätzlich auf gleiche Haltefolge geprüft und bei Abweichung zu *geändert* herabgestuft
        (`reason: route`).


        Was danach übrig bleibt, wird nach Start- und Zielhalt gebündelt und innerhalb dieser
        Bündel nach nächstgelegener Abfahrtszeit gepaart. Über einer Stunde Abstand wird nicht mehr
        gepaart — dann sind es eine entfallene und eine neue Fahrt, keine verschobene. Der am
        Produktivbestand gemessene Extremfall liegt bei 43 Minuten.


        Beide Versionen müssen dieselbe Linie und denselben Fahrplantyp tragen; sonst 422.


        **Die Periode darf abweichen** (seit 21.09.2026). An der Periodengrenze ist der Vergleich
        am aussagekräftigsten: Die letzte Version der alten und Version 1 der neuen Periode folgen
        unmittelbar aufeinander. Weil `version_no` je Periode wieder bei 1 beginnt, trägt jede
        Version in der Antwort ihre Periode mit.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: from
          in: query
          required: true
          description: '`line_versions.id` der älteren Version.'
          schema: { type: integer }
        - name: to
          in: query
          required: true
          schema: { type: integer }
        - name: include
          in: query
          required: false
          description: '`stops` ergänzt je geänderter Fahrt den Halt-für-Halt-Vergleich.'
          schema: { type: string, enum: [stops] }
      responses:
        '200':
          description: Unterschied der beiden Versionen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineVersionDiffResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Version, identische IDs, oder verschiedene Linie/Fahrplantyp/Periode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/lines/{line}/courses:
    parameters:
      - name: line
        in: path
        required: true
        description: Linienbezeichnung (`route_short_name`), z. B. "1" oder "N5".
        schema: { type: string }
    get:
      operationId: getLineCourses
      summary: Die Umlaeufe einer Linie im Ganzen
      description: >
        Je Kurs seine Fahrten in Fahrreihenfolge, die Stellen, an denen die Kette reisst, und
        die Fahrten dieser Linie, die noch zu keinem Umlauf gehoeren.


        **Ein Umlauf kann mehrere Linien umfassen** und erscheint dann bei jeder von ihnen — mit
        **allen** seinen Fahrten, auch denen der anderen Linien. Eine 1 wird in Sudenburg zur 13;
        wer den Umlauf pflegt, muss ihn ganz sehen.


        **`gap_before_seconds` und `linked_to_previous` gehoeren zusammen gelesen.** Ein grosser
        Abstand *mit* Anschluss ist eine lange Wende; ein Abstand *ohne* Anschluss ist eine
        gerissene Kette. Ein Umlauf muss keine durchgehende Kette sein: Loest man einen Anschluss
        in der Mitte, bleibt der Kurs an beiden Teilen haengen — gewollt, weil die Zuordnung
        bewahrt und nicht geraten wird.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: integer }
        - name: day_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FahrplanTyp' }
      responses:
        '200':
          description: Umlaeufe, Ketten und offene Fahrten
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineCourseOverviewResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Periode oder unbekannter Fahrplantyp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/line-versions/{lineVersion}/course-carryover:
    parameters:
      - name: lineVersion
        in: path
        required: true
        description: Die **Ziel**-Version, auf die uebernommen wird.
        schema: { type: integer }
    get:
      operationId: previewCourseCarryover
      summary: Vorschau — was eine Uebernahme bewirken wuerde
      description: >
        **Garantiert folgenlos.** Bewusst ein eigener Endpunkt statt eines Schalters am POST: Wer
        die Vorschau aufruft, soll sich darauf verlassen koennen, dass nichts geschrieben wird.


        Der Import uebertraegt von sich aus **nichts** (KURSE §2 K4). Eine neue Version bedeutet
        geaenderte Zeiten; ob ein Anschluss das ueberlebt, haengt an der Wendezeit — eine um zehn
        Minuten verschobene Abfahrt kann ihn unmoeglich machen. Eine stille Uebernahme schriebe
        solche Faelle fort.


        Was uebertragen wird: die **Kursnummer**, sobald es eine Partnerfahrt gibt (auch bei
        verschobener Zeit — eine andere Zeit macht keinen anderen Umlauf); **Aus- und Einruecken**,
        weil sie an einer Fahrt allein haengen; und **Anschluesse innerhalb dieser Version**.
        Anschluesse auf eine andere Linie stehen unter `blocked`.


        Bereits gesetzte Pflege an der neuen Version gewinnt: Sie ist die juengere Aussage.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: from
          in: query
          required: true
          description: Die **Quell**-Version. Muss dieselbe Linie, denselben Fahrplantyp und dieselbe Periode tragen.
          schema: { type: integer }
      responses:
        '200':
          description: Was eine Uebernahme bewirken wuerde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseCarryoverResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Quelle, identische Versionen, oder verschiedene Linie/Fahrplantyp/Periode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: applyCourseCarryover
      summary: Uebernahme anwenden
      description: >
        Fuehrt aus, was die Vorschau angekuendigt hat, und antwortet in derselben Form — die
        Zahlen sind dann die tatsaechlich geschriebenen. **Mehrfach anwendbar:** Ein zweiter Lauf
        aendert nichts mehr, weil bereits gesetzte Pflege gewinnt.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from: { type: integer }
      responses:
        '200':
          description: Uebernommen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseCarryoverResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Quelle, identische Versionen, oder verschiedene Linie/Fahrplantyp/Periode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/line-versions/{lineVersion}/course-sequence:
    parameters:
      - name: lineVersion
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: previewCourseSequence
      summary: Vorschau — Kursnummern ueber einen Spaltenbereich fortschreiben oder entfernen
      description: >
        **Garantiert folgenlos.** Schreibt eine erkannte Nummernfolge ueber die markierten Spalten
        der Fahrplan-Matrix fort: Linie 6 faehrt die Kurse 1–8 in chronologischer Abfolge, und bei
        gleichbleibendem Takt laesst sich das logisch fortsetzen, statt jede Spalte einzeln zu
        tippen.


        **Gearbeitet wird je Richtung.** Nur dort stehen die Fahrten in der Reihenfolge, in der die
        Nummern umlaufen. Die Richtung ist kein Parameter — sie folgt aus `from_trip_id`; liegt
        `to_trip_id` in einer anderen, ist das ein 422. Die Spaltenreihenfolge ist die der Matrix
        (entlang des Betriebstags, nicht der Uhr).


        **Die Nummer gehoert der Kette, nicht der Fahrt** (KURSE §2 K2). Geplant wird deshalb je
        Kette, und eine Zuweisung zieht die ganze Kette mit — auch Fahrten der Gegenrichtung. Diese
        stehen unter `outside_range`, und `summary.trips_affected` ist groesser als
        `summary.columns`. Bei `action=clear` gilt dasselbe in die andere Richtung: `detach()`
        raeumt die ganze Kette ab.


        **Nie ueberschreiben.** Traegt eine Kette bereits einen anderen Kurs, wird sie uebersprungen
        (`already_assigned`); traegt sie genau die geplante Nummer, zaehlt das als `unchanged`. Ein
        zweiter Lauf ist damit folgenlos. Sollen zwei Fahrten **derselben** Kette verschiedene
        Nummern bekommen, wird die Kette gar nicht geschrieben (`conflicts`) — welche die richtige
        ist, weiss nur der Pflegende.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: from_trip_id
          in: query
          required: true
          description: Die markierte **Startspalte** (`consolidated_trips.id`).
          schema: { type: integer }
        - name: to_trip_id
          in: query
          required: true
          description: Die markierte **letzte Spalte**. Verkehrt herum markiert wird getauscht.
          schema: { type: integer }
        - name: action
          in: query
          required: false
          description: Vorgabe `assign`.
          schema: { type: string, enum: [assign, clear] }
        - name: pattern
          in: query
          required: false
          description: >
            Die Nummernfolge, z. B. `1-8`, `31-35`, `01-08` oder `1-4, 7, 9-12`. Sie laeuft ab der
            Startspalte **zyklisch** ueber die markierten Spalten. Pflicht bei `action=assign`,
            ohne Wirkung bei `action=clear`.


            **Fuehrende Nullen bleiben erhalten:** `01-08` ergibt `01`…`08`, `1-8` dagegen `1`…`8`.
            `courses.number` ist `varchar(8)`, und `03` und `3` sind zwei verschiedene Kurse.
          schema: { type: string, maxLength: 120, example: '01-08' }
      responses:
        '200':
          description: Was der Lauf bewirken wuerde
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseSequenceResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            Unbekannte Fahrt, Fahrt aus einer anderen Version, Markierungen in verschiedenen
            Richtungen, oder unlesbares Muster
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: applyCourseSequence
      summary: Kursnummern setzen oder entfernen
      description: >
        Fuehrt aus, was die Vorschau angekuendigt hat, und antwortet in derselben Form — die Zahlen
        sind dann die tatsaechlich geschriebenen. Der Plan wird neu gerechnet, weil zwischen
        Vorschau und Anwenden etwas anderes geschrieben worden sein kann.


        Geschrieben wird ueber die Ketten-Semantik (`findOrCreateForChain` + `assign`, bzw.
        `detach`), nie roh in `course_trips`. **Mehrfach anwendbar:** Ein zweiter Lauf aendert
        nichts mehr.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_trip_id, to_trip_id]
              properties:
                from_trip_id: { type: integer }
                to_trip_id: { type: integer }
                action: { type: string, enum: [assign, clear], default: assign }
                pattern: { type: string, maxLength: 120, example: '01-08' }
      responses:
        '200':
          description: Geschrieben
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseSequenceResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            Unbekannte Fahrt, Fahrt aus einer anderen Version, Markierungen in verschiedenen
            Richtungen, oder unlesbares Muster
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/courses:
    get:
      operationId: listCourses
      summary: Umlaeufe einer Periode und eines Fahrplantyps
      description: >
        Die vergebenen Kursnummern samt der Linien, die der jeweilige Umlauf beruehrt.
        `line` schraenkt auf Umlaeufe ein, die diese Linie beruehren — ein Umlauf kann mehrere
        Linien umfassen und erscheint dann bei jeder.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: integer }
        - name: day_type
          in: query
          required: true
          schema: { $ref: '#/components/schemas/FahrplanTyp' }
        - name: line
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Umlaeufe, nach Nummer sortiert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseListResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannte Periode oder unbekannter Fahrplantyp
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createCourse
      summary: Umlauf anlegen
      description: >
        Legt eine Kursnummer an, ohne ihr schon Fahrten zuzuordnen. Meist unnoetig: Das
        Zuordnen an einer Fahrt legt einen noch unbekannten Kurs selbst an.


        **Keine Eindeutigkeitspruefung.** Die Nummer ist je Linie bzw. Linienkombination eindeutig,
        nicht netzweit (KURSE §2 K3) — und die Linien eines Kurses stehen erst fest, wenn ihm
        Fahrten zugeordnet sind. Ein Widerspruch wird im Feld `duplicate` gemeldet, nicht abgewiesen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_id, day_type, number]
              properties:
                period_id: { type: integer }
                day_type: { $ref: '#/components/schemas/FahrplanTyp' }
                number: { type: string, maxLength: 8 }
                note: { type: string, nullable: true, maxLength: 255 }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Course' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Pflichtfeld fehlt oder unbekannte Periode
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/courses/{course}:
    parameters:
      - name: course
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateCourse
      summary: Kursnummer oder Notiz aendern
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number: { type: string, maxLength: 8 }
                note: { type: string, nullable: true, maxLength: 255 }
      responses:
        '200':
          description: Geaendert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Course' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unbekannter Umlauf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteCourse
      summary: Umlauf loeschen
      description: >
        Loescht die Kursnummer. Die Fahrten bleiben und ihre Verkettung ebenfalls — nur das
        Etikett faellt weg.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '204':
          description: Geloescht
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/consolidated-trips/{consolidatedTrip}/course:
    parameters:
      - name: consolidatedTrip
        in: path
        required: true
        description: '`consolidated_trips.id` — irgendeine Fahrt der Kette.'
        schema: { type: integer }
    put:
      operationId: assignCourseToTrip
      summary: Kurs der ganzen Kette zuordnen
      description: >
        Setzt den Kurs fuer **alle** Fahrten der Kette, zu der diese Fahrt gehoert — die
        Kursnummer ist ein Etikett am Umlauf, nicht an der Fahrt (KURSE §2 K2). Welche Fahrt
        der Kette angegeben wird, ist gleichgueltig.


        Entweder `course_id` (bestehender Umlauf) oder `number` (wird angelegt, falls im
        selben Periode/Fahrplantyp noch nicht vorhanden). `number` ist der uebliche Weg: Wer
        eine Nummer am Fahrzeug abliest, will sie eintippen und nicht erst einen Kurs anlegen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course_id: { type: integer, nullable: true }
                number: { type: string, nullable: true, maxLength: 8 }
      responses:
        '200':
          description: Zugeordnet — `trips_assigned` nennt die Laenge der Kette
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseAssignmentResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unbekannte Fahrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >
            Weder `course_id` noch `number` angegeben, beide zugleich, oder der Kurs gehoert zu
            einer anderen Periode bzw. einem anderen Fahrplantyp als die Fahrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: detachCourseFromTrip
      summary: Kurs von der ganzen Kette loesen
      description: >
        Nimmt den Kurs von allen Fahrten der Kette. Der Umlauf selbst bleibt bestehen und kann
        erneut vergeben werden.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '200':
          description: Geloest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseAssignmentResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unbekannte Fahrt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/stop-groups:
    get:
      operationId: listStopGroups
      summary: Haltestellen als Betriebspunkte
      description: >
        Je Haltestelle ihre Halte, ob dort Fahrten beginnen oder enden, und welche Linien sie
        beruehren (KURSE §2, K6).


        **Warum es diese Ebene gibt.** Die Konsolidierung verschmilzt Halte nur bei ≤ 12 m und
        gleichem Namen. An „Herrenkrug" enden die Fahrten auf dem einen Bahnsteig und beginnen
        72 m weiter auf dem anderen; netzweit sind 64 von 104 Endstellen so gebaut, das sind
        54,6 % aller Fahrt-Endpunkte. Ohne diese Klammer liesse sich dort kein Anschluss bilden.


        Die Gruppierung laeuft automatisch ueber den normalisierten Namen und deckt damit 49
        der 64 Faelle ab. Der Rest ist hier von Hand zu pflegen.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      parameters:
        - name: q
          in: query
          required: false
          description: Sucht in den Namen der Haltestelle und ihrer Halte.
          schema: { type: string }
        - name: only_termini
          in: query
          required: false
          description: Nur Haltestellen, an denen Fahrten beginnen oder enden — netzweit 63 von 315.
          schema: { type: boolean }
      responses:
        '200':
          description: Haltestellen mit ihren Halten
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopGroupListResponse' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createStopGroup
      summary: Haltestelle von Hand anlegen
      description: >
        Eine von Hand angelegte Haltestelle traegt **keinen** Namensschluessel: Sie soll bei der
        naechsten Automatik keine fremden Halte einsammeln.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                note: { type: string, nullable: true, maxLength: 255 }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StopGroup' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Name fehlt oder ist zu lang
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/stop-groups/{stopGroup}:
    parameters:
      - name: stopGroup
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getStopGroup
      summary: Eine Haltestelle samt Vorschlaegen
      description: >
        Wie die Liste, zusaetzlich `suggestions`: andere Haltestellen in Laufweite, die das
        fehlende Gegenstueck sein koennten.
      tags: [Admin]
