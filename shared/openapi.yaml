      summary: Halt aus der Haltestelle herausloesen
      description: >
        Gibt den Halt der Automatik zurueck: Er landet wieder in der Gruppe seines
        Namensschluessels.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      responses:
        '204':
          description: Geloest
