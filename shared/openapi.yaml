      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
                note: { type: string, nullable: true, maxLength: 255 }
      responses:
        '200':
          description: Geaendert
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StopGroup' }
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unbekannte Haltestelle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/stop-groups/{stopGroup}/stops:
    parameters:
      - name: stopGroup
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: assignStopToGroup
      summary: Halt dieser Haltestelle zuordnen
      description: >
        Die Zuordnung gilt danach als **von Hand gesetzt** und ist damit vor dem Namensabgleich
        geschuetzt. Bleibt die bisherige Haltestelle leer zurueck, wird sie geloescht — eine
        Haltestelle ohne Halte ist keine.
      tags: [Admin]
      security: [{ AdminToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consolidated_stop_id]
              properties:
                consolidated_stop_id: { type: integer }
      responses:
        '204':
          description: Zugeordnet
        '401':
          description: Nicht authentifiziert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Unbekannter Halt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/admin/stop-groups/{stopGroup}/stops/{stop}:
    parameters:
      - name: stopGroup
        in: path
        required: true
